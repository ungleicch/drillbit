<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drillbit</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0b0b0e" />
  <meta name="description" content="A local-first study app with class management, JSON question uploads, practice sessions, and progress tracking." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/polish.css" />
</head>
<body>
  <!-- ── Navbar ── -->
  <nav id="navbar">
    <div class="nav-inner">
      <a href="#/" class="nav-logo" id="nav-logo-link">
        <img class="logo-icon" src="/favicon.svg" alt="" width="20" height="20" />
        <span class="logo-text">Drillbit</span>
      </a>
      <div class="nav-actions">
        <button class="btn btn-ghost" id="nav-history-btn" title="Session History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History
        </button>
        <button class="btn btn-ghost btn-icon" id="nav-help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
        <button class="btn btn-primary" id="nav-new-class-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Class
        </button>
      </div>
    </div>
  </nav>

  <!-- ── Main App ── -->
  <main id="app">
    <div id="view-container"></div>
  </main>

  <!-- ── Modal Overlay ── -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <button id="modal-close" class="modal-close-btn" aria-label="Close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ── Toast Container ── -->
  <div id="toast-container"></div>

  <!-- ── Confetti Canvas ── -->
  <canvas id="confetti-canvas"></canvas>

  <!-- ── Scripts ── -->
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modals.js"></script>
  <script src="/js/components/confetti.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/classView.js"></script>
  <script src="/js/views/topicView.js"></script>
  <script src="/js/views/session.js"></script>
  <script src="/js/views/results.js"></script>
  <script src="/js/views/history.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/qol.js"></script>
</body>
</html>
